<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ranger Strike</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   RANGER STRIKE - eigenes Top-Down-Kommandospiel im C64-Look
   Einzelkaempfer hinter den feindlichen Linien. Alle Grafiken und Sounds
   werden im Code erzeugt (keine fremden Assets).
   ===================================================================== */
let W=320,dirty=true,fsTried=false;const H=200,T=16,MW=96,MH=96;
const C={k:'#000000',w:'#ffffff',r:'#68372b',c:'#70a4b2',p:'#6f3d86',g:'#588d43',b:'#352879',y:'#b8c76f',o:'#6f4f25',n:'#433900',lr:'#9a6759',dg:'#444444',gr:'#6c6c6c',lg:'#9ad284',lb:'#6c5eb5',lgr:'#959595'};
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;
function fit(){
  const asp=innerWidth/Math.max(1,innerHeight),nw=Math.max(320,Math.min(480,Math.round(H*asp)));
  if(nw!==W){W=nw;cv.width=W;dirty=true}
  const s=Math.min(innerWidth/W,innerHeight/H),f=Math.floor(s),k=(f>=2&&f>=s*0.94)?f:s;
  cv.style.width=Math.round(W*k)+'px';cv.style.height=Math.round(H*k)+'px';
}
function goFS(){try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(screen.orientation&&screen.orientation.lock)screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}
function toggleFS(){try{if(document.fullscreenElement)document.exitFullscreen();else goFS()}catch(e){}}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));fit();

/* ---------- Hilfsfunktionen ---------- */
function mkRng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R=mkRng(1);
const rnd=(a,b)=>a+R()*(b-a), ri=(a,b)=>Math.floor(rnd(a,b+1));
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const angDiff=(a,b)=>{let d=a-b;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d};
const hash=(x,y)=>((x*73856093)^(y*19349663))>>>0;

/* ---------- Audio (WebAudio, synthetisch) ---------- */
let AC=null;
function initAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,slide){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
function boom(v){if(!AC)return;try{const n=(AC.sampleRate*.5)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=v||.2;s.connect(g);g.connect(AC.destination);s.start()}catch(e){}}

/* ---------- Eingabe ---------- */
const keys={},hit={};
addEventListener('keydown',e=>{initAudio();if(e.code==='KeyF'&&!e.repeat)toggleFS();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!keys[e.code])hit[e.code]=true;keys[e.code]=true});
addEventListener('keyup',e=>{keys[e.code]=false});
const was=c=>!!hit[c];
let touchMode=false;
const tp={jid:null,jx:0,jy:0,dx:0,dy:0,btn:{},fire:false,nade:false,use:false,run:false};
const PAD={x:274,y:H-46,r:34};
function layoutBtn(){PAD.x=W-46}
const BTN={fire:{x:36,y:H-38,r:22,l:'FEUER'},nade:{x:80,y:H-26,r:14,l:'GRN'},use:{x:24,y:H-84,r:14,l:'AKT'},run:{x:76,y:H-66,r:13,l:'RENN'}};
function lp(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(e.pointerType==='touch')touchMode=true;e.preventDefault();
  const p=lp(e),x=p[0],y=p[1];
  if(state==='menu'){menuButtons().forEach((b,i)=>{const by=70+i*28,o=(W-320)/2;if(x>40+o&&x<280+o&&y>by&&y<by+24)menuPick(i)});return}
  if(state==='skill'){SKILLS.forEach((s2,i)=>{const by=18+i*31,o=(W-320)/2;if(x>20+o&&x<300+o&&y>by&&y<by+30)pickSkill(i)});return}
  if(state==='win'||state==='lose'){if(endT>0.6)advance();return}
  if(state==='pause'){state='play';return}
  if(state==='confirm'){if(y>94&&y<114){if(x>W/2-72&&x<W/2-8)abortMission();else if(x>W/2+8&&x<W/2+72)state='play'}return}
  if(x>W-26&&y<16){askAbort();return}
  for(const k in BTN){const b=BTN[k];if(Math.hypot(x-b.x,y-b.y)<b.r+4){tp.btn[e.pointerId]=k;if(k==='fire')tp.fire=true;if(k==='nade')tp.nade=true;if(k==='use')tp.use=true;if(k==='run')tp.run=!tp.run;try{cv.setPointerCapture(e.pointerId)}catch(_){}return}}
  if(Math.hypot(x-PAD.x,y-PAD.y)<PAD.r+18&&tp.jid===null){tp.jid=e.pointerId;tp.jx=x;tp.jy=y;tp.dx=tp.dy=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}}
});
cv.addEventListener('pointermove',e=>{if(e.pointerId===tp.jid){const p=lp(e);tp.jx=p[0];tp.jy=p[1]}});
const pUp=e=>{if(e.pointerType==='touch'&&!fsTried){fsTried=true;goFS()}if(e.pointerId===tp.jid){tp.jid=null;tp.dx=tp.dy=0}const k=tp.btn[e.pointerId];if(k){if(k==='fire')tp.fire=false;delete tp.btn[e.pointerId]}};
cv.addEventListener('pointerup',pUp);cv.addEventListener('pointercancel',pUp);
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Missionen ---------- */
const MISSIONS=[
  {name:'FUNKENFLUG',desc:'Sprenge 3 Munitionsdepots',obj:{depot:3},enemies:32},
  {name:'FREIHEIT',desc:'Befreie Gefangene aus 3 Lagern',obj:{hut:3},enemies:38},
  {name:'SCHATTENAKTE',desc:'Stiehl Dokumente aus 2 Kommandoposten',obj:{hq:2},enemies:44},
  {name:'GROSSER SCHLAG',desc:'2 Depots, 1 Lager, 1 Kommandopost',obj:{depot:2,hut:1,hq:1},enemies:52}
];
const SKILLS=[
  {name:'TREFFSICHERHEIT',d1:'ZIELHILFE UND KEINE STREUUNG',d2:'SCHNELLERES FEUER, MEHR MUNITION'},
  {name:'TARNUNG',d1:'GEGNER SEHEN DICH NUR AUS DER NAEHE',d2:'LEISERE SCHUESSE, SCHNELLER SCHLEICHEN'},
  {name:'SPRENGMEISTER',d1:'MEHR GRANATEN, GROESSERER RADIUS',d2:'KURZE ZUENDSCHNUR, WENIGER SELBSTSCHADEN'},
  {name:'RESILIENZ',d1:'MEHR LEBEN UND WENIGER SCHADEN',d2:'SCHNELLERE KRAFT, STAERKERE MEDIKITS'},
  {name:'NORMAL',d1:'KEINE BESONDEREN FAEHIGKEITEN',d2:'AUSGEGLICHENE GRUNDWERTE'}
];
const SIZES={depot:[3,2],hut:[2,2],hq:[3,3],plain:[2,2]};

/* ---------- Spielzustand ---------- */
let state='menu',map,blds=[],enemies=[],bullets=[],nades=[],parts=[],picks=[],P,cam={x:0,y:0},LZ={x:0,y:0};
let lastSay=-9,rfCd=0,shotHeat=0,skill=0,total=0,save=null,mission=null,mIdx=0,time=0,kills=0,ready=false,msg='',msgT=0,shake=0,flash=0,endT=0,showMap=true,score=0,mm=null,lastTime=0;

const tileAt=(tx,ty)=>(tx<0||ty<0||tx>=MW||ty>=MH)?2:map[ty*MW+tx];
const isSolid=(px,py)=>{const t=tileAt(Math.floor(px/T),Math.floor(py/T));return t===1||t===2||t===3||t===5};
const hitSolid=(x,y,r)=>isSolid(x-r,y-r)||isSolid(x+r,y-r)||isSolid(x-r,y+r)||isSolid(x+r,y+r);
function moveEnt(o,dx,dy,r){let m=false;if(dx&&!hitSolid(o.x+dx,o.y,r)){o.x+=dx;m=true}if(dy&&!hitSolid(o.x,o.y+dy,r)){o.y+=dy;m=true}return m}
function los(x0,y0,x1,y1){const d=dist(x0,y0,x1,y1),n=Math.ceil(d/6);for(let i=1;i<n;i++){const t=i/n,v=tileAt(Math.floor((x0+(x1-x0)*t)/T),Math.floor((y0+(y1-y0)*t)/T));if(v===1||v===2||v===5)return false}return true}
function showMsg(s,t){msg=s;msgT=t||2.2}

/* ---------- Kartengenerator ---------- */
function genMap(mi){
  R=mkRng(((Date.now()&0xffffff)+mi*977)|0);
  map=new Uint8Array(MW*MH);blds=[];
  const set=(x,y,v)=>{if(x>=0&&y>=0&&x<MW&&y<MH)map[y*MW+x]=v};
  const blob=(cx,cy,r,v,p)=>{for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r&&R()<p)set(cx+x,cy+y,v)};
  for(let i=0;i<70;i++)blob(ri(0,MW),ri(0,MH),ri(2,6),1,0.6);
  for(let i=0;i<22;i++)blob(ri(0,MW),ri(0,MH),ri(1,3),2,0.8);
  for(let i=0;i<7;i++)blob(ri(8,MW-8),ri(8,MH-30),ri(3,5),3,1);
  for(let i=0;i<MW;i++)for(let k=0;k<2;k++){set(i,k,2);set(i,MH-1-k,2)}
  for(let i=0;i<MH;i++)for(let k=0;k<2;k++){set(k,i,2);set(MW-1-k,i,2)}
  const sx=MW>>1,sy=MH-6;
  blob(sx,sy,6,0,1);blob(sx,sy,3,4,1);
  LZ.x=sx*T+T/2;LZ.y=sy*T+T/2;
  const place=(kind)=>{
    const tw=SIZES[kind][0],th=SIZES[kind][1];
    for(let tr=0;tr<400;tr++){
      const tx=ri(6,MW-7-tw),ty=ri(6,MH-28-th);
      if(blds.some(b=>tx<b.tx+b.tw+6&&tx+tw+6>b.tx&&ty<b.ty+b.th+6&&ty+th+6>b.ty))continue;
      for(let y=ty-2;y<ty+th+2;y++)for(let x=tx-2;x<tx+tw+2;x++)if(R()<.85)set(x,y,7);else set(x,y,0);
      for(let y=ty;y<ty+th;y++)for(let x=tx;x<tx+tw;x++)set(x,y,5);
      const b={tx,ty,tw,th,kind,done:false,fuse:0,x:tx*T,y:ty*T,w:tw*T,h:th*T};blds.push(b);return b;
    }
    return null;
  };
  const objs=[];
  for(const k in mission.obj)for(let i=0;i<mission.obj[k];i++){const b=place(k);if(b)objs.push(b)}
  for(let i=0;i<6;i++)place('plain');
  const carve=(x0,y0,x1,y1)=>{
    let x=x0,y=y0,g=0;
    while((Math.abs(x-x1)>3||Math.abs(y-y1)>3)&&g++<900){
      const px=x,py=y,dx=x1-x,dy=y1-y;
      if(R()<0.55){if(Math.abs(dx)>Math.abs(dy))x+=Math.sign(dx);else y+=Math.sign(dy)}
      else{if(R()<0.5)x+=ri(-1,1);else y+=ri(-1,1)}
      x=Math.max(3,Math.min(MW-4,x));y=Math.max(3,Math.min(MH-4,y));
      if(map[y*MW+x]===5){x=px;y=py;continue}
      for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const i=(y+b)*MW+x+a;if(map[i]!==5)map[i]=7}
    }
  };
  for(const b of objs)carve(sx,sy-4,b.tx+(b.tw>>1),b.ty+b.th+2);
  setupZones(mi);
  for(const b of blds){b.spr=makeBldSprite(b,false);if(b.kind==='depot'||b.kind==='hut')b.sprD=makeBldSprite(b,true)}
  // Minimap-Terrain
  mm=document.createElement('canvas');mm.width=MW;mm.height=MH;
  const mc=mm.getContext('2d');
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const t=map[y*MW+x];mc.fillStyle=t===1?'#2c6a2a':t===2?'#7a7a7a':t===3?'#2a4f9e':t===4?'#cdb97a':t===7?'#8c6c3e':t===6?'#2a2622':'#5a8f45';mc.fillRect(x,y,1,1)}
  return {sx,sy};
}

function newEnemy(x,y){return{x,y,a:rnd(0,6.28),dead:false,t:0,st:0,tx:x,ty:y,wait:rnd(0,2),cd:rnd(.5,1.5),lost:0,lx:x,ly:y}}
function freeSpot(x,y){return !hitSolid(x,y,6)}
function clearLine(x0,y0,x1,y1){const d=dist(x0,y0,x1,y1),n=Math.ceil(d/5);for(let i=1;i<=n;i++){const t=i/n;if(hitSolid(x0+(x1-x0)*t,y0+(y1-y0)*t,4))return false}return true}
function makePatrol(e){
  const pts=[{x:e.x,y:e.y}],n=ri(2,4);let px=e.x,py=e.y,g=0;
  while(pts.length<n+1&&g++<50){
    const a=rnd(0,6.283),d=rnd(55,140),x=px+Math.cos(a)*d,y=py+Math.sin(a)*d;
    if(x<4*T||x>(MW-4)*T||y<4*T||y>(MH-4)*T||hitSolid(x,y,6)||!clearLine(px,py,x,y))continue;
    pts.push({x,y});px=x;py=y;
  }
  e.wp=pts;e.wi=pts.length>1?1:0;e.wd=1;e.wait=rnd(0,1.5);e.la=e.a;e.ph=rnd(0,6.28);e.stuck=0;
}
function spawnEnemies(n){
  enemies=[];const spots=[];
  for(const b of blds){const g=b.kind==='plain'?1:3;for(let i=0;i<g;i++)spots.push([b.x+b.w/2+rnd(-60,60),b.y+b.h+rnd(8,40)])}
  let guard=0;
  while(spots.length<n+20&&guard++<500)spots.push([rnd(6*T,(MW-6)*T),rnd(6*T,(MH-22)*T)]);
  for(const s of spots){
    if(enemies.length>=n)break;
    if(!freeSpot(s[0],s[1])||dist(s[0],s[1],P.x,P.y)<220)continue;
    {const e0=newEnemy(s[0],s[1]);makePatrol(e0);enemies.push(e0)}
  }
}
function spawnPicks(){
  picks=[];let g=0;
  while(picks.length<16&&g++<300){
    const x=rnd(5*T,(MW-5)*T),y=rnd(5*T,(MH-8)*T);
    if(!freeSpot(x,y))continue;
    picks.push({x,y,t:['a','a','g','m'][ri(0,3)]});
  }
}

function startMission(i){
  mIdx=i;mission=MISSIONS[i];
  genMap(i);
  P={x:LZ.x,y:LZ.y-24,a:-Math.PI/2,hp:100+(skill===3?50:0),maxHp:100+(skill===3?50:0),st:100,ammo:80+(skill===0?20:0),nades:8+(skill===2?4:0),maxA:99+(skill===0?25:0),maxG:9+(skill===2?5:0),cd:0,run:false,sneak:false,exh:false,step:0,moving:false};
  rfCd=0;shotHeat=0;lastSay=-9;bullets=[];nades=[];parts=[];decals=[];blasts=[];kills=0;time=0;ready=false;score=0;shake=0;flash=0;endT=0;
  spawnEnemies(mission.enemies);spawnPicks();
  cam.x=0;cam.y=MH*T;
  showMsg('LEVEL '+(i+1)+': '+mission.desc.toUpperCase(),3.5);
  state='play';
}

/* ---------- Spiellogik ---------- */
function noise(x,y,r){for(const e of enemies){if(!e.dead&&e.st===0&&dist(e.x,e.y,x,y)<r){e.st=1;e.lost=5;e.lx=x;e.ly=y}}}
function hurt(n){if(P.hp<=0||state!=='play')return;P.hp-=(skill===3?n*.85:n);flash=.15;tone(90,.12,'sawtooth',.06,-30);if(P.hp<=0){P.hp=0;state='lose';endT=0;showMsg('GEFALLEN!',5)}}
function killEnemy(e){
  if(e.dead)return;e.dead=true;e.t=0;kills++;tone(200,.12,'sawtooth',.05,-150);
  const r=R();if(r<.30)picks.push({x:e.x,y:e.y,t:'a'});else if(r<.42)picks.push({x:e.x,y:e.y,t:'g'});else if(r<.50)picks.push({x:e.x,y:e.y,t:'m'});
  for(let i=0;i<6;i++)parts.push({x:e.x,y:e.y,vx:rnd(-40,40),vy:rnd(-40,40),life:rnd(.2,.5),c:C.r});
}
function objDone(){
  const objs=blds.filter(b=>b.kind!=='plain');
  const d=objs.filter(b=>b.done).length;
  if(d===objs.length){ready=true;showMsg('ALLE ZIELE ERFUELLT - ZUR LANDEZONE!',4.5);tone(500,.3,'square',.05,300)}
  else showMsg('ZIEL '+d+'/'+objs.length+' ERLEDIGT',2.5);
}
function destroyDepot(b){
  if(b.done)return;b.done=true;
  for(let y=b.ty;y<b.ty+b.th;y++)for(let x=b.tx;x<b.tx+b.tw;x++)map[y*MW+x]=6;
  explode(b.x+b.w/2,b.y+b.h/2,44);
  objDone();
}
function pushP(o){o.max=o.life;parts.push(o)}
function explode(x,y,r){
  boom(.25);shake=.4;noise(x,y,260);callRf(2);
  blasts.push({x,y,r:r*1.1,t:0});
  decals.push({x,y,r:Math.round(r*.45)});if(decals.length>70)decals.shift();
  for(let i=0;i<16;i++){const a=rnd(0,6.28),sp=rnd(10,r*1.8);pushP({k:'fire',x:x+Math.cos(a)*rnd(0,r*.3),y:y+Math.sin(a)*rnd(0,r*.3),vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.3,.65),r0:rnd(4,7),r1:rnd(1,3),fr:.93})}
  for(let i=0;i<10;i++)pushP({k:'smoke',x:x+rnd(-r*.4,r*.4),y:y+rnd(-r*.4,r*.4),vx:rnd(-14,14),vy:rnd(-30,-8),life:rnd(1,2),r0:3,r1:rnd(8,12),fr:.98});
  for(let i=0;i<14;i++){const a=rnd(0,6.28),sp=rnd(30,120);pushP({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rnd(.4,.9),c:['#3a3a3a','#6b5a3a','#8a8472','#ffb030'][ri(0,3)],s:ri(1,2),fr:.94})}
  for(const e of enemies)if(!e.dead&&dist(e.x,e.y,x,y)<r)killEnemy(e);
  const d=dist(P.x,P.y,x,y);if(d<r*1.1)hurt(Math.max(1,Math.round((70*(1-d/(r*1.1))+5)*(skill===2?.45:1))));
  for(const b of blds)if(b.kind==='depot'&&!b.done){
    const dx=Math.max(b.x-x,0,x-(b.x+b.w)),dy=Math.max(b.y-y,0,y-(b.y+b.h));
    if(Math.hypot(dx,dy)<r*0.7)destroyDepot(b);
  }
}
function nearObj(){
  let best=null,bd=99;
  for(const b of blds){
    if(b.kind==='plain'||b.done)continue;
    const dx=Math.max(b.x-P.x,0,P.x-(b.x+b.w)),dy=Math.max(b.y-P.y,0,P.y-(b.y+b.h)),d=Math.hypot(dx,dy);
    if(d<14&&d<bd){bd=d;best=b}
  }
  return best;
}
function interact(){
  const b=nearObj();if(!b)return;
  if(b.kind==='depot'){if(b.fuse<=0){b.fuse=skill===2?2.5:4;showMsg('LADUNG GELEGT - WEG DA!',2.5);tone(300,.1,'square',.05)}}
  else if(b.kind==='hut'){b.done=true;tone(600,.2,'square',.05,400);objDone()}
  else if(b.kind==='hq'){b.done=true;tone(700,.2,'square',.05,300);objDone()}
}
function shootEnemy(e){
  const a=e.a+rnd(-.16,.16);e.fl=time+.06;
  bullets.push({x:e.x+Math.cos(a)*6,y:e.y+Math.sin(a)*6,vx:Math.cos(a)*150,vy:Math.sin(a)*150,life:1.2,own:false});
  tone(500,.05,'square',.025,-250);
}
function sayEnemy(){
  tone(700,.12,'square',.05,-200);setTimeout(()=>tone(520,.14,'square',.05,-120),120);
  if(time-lastSay<2.5)return;lastSay=time;
  try{const u=new SpeechSynthesisUtterance('Enemy!');u.lang='en-US';u.rate=1.25;u.pitch=.8;u.volume=.7;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}
}
function callRf(n){
  if(state!=='play'||time<rfCd)return;
  let alive=0;for(const e of enemies)if(!e.dead&&e.rf)alive++;

    const a=rnd(0,6.283),d=rnd(W/2+30,W/2+170),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d*.8;
    if(x<5*T||x>(MW-5)*T||y<5*T||y>(MH-5)*T||!freeSpot(x,y))continue;
    if(Math.abs(x-P.x)<W/2+24&&Math.abs(y-P.y)<H/2+24)continue;
    const e=newEnemy(x,y);e.rf=true;e.st=1;e.lost=9;e.lx=P.x;e.ly=P.y;e.a=Math.atan2(P.y-y,P.x-x);e.wait=0;enemies.push(e);made++;

function update(dt){
  if(state==='menu'){const bl=menuButtons();let go=-1;for(let i=0;i<bl.length;i++)if(was('Digit'+(i+1))||was('Numpad'+(i+1)))go=i;if(go<0&&(was('Enter')||was('Space')))go=0;if(go>=0)menuPick(go);return}
  if(state==='skill'){for(let i=0;i<SKILLS.length;i++)if(was('Digit'+(i+1))||was('Numpad'+(i+1)))pickSkill(i);if(was('Escape'))state='menu';return}
  if(state==='win'||state==='lose'){endT+=dt;if(endT>0.6&&(was('Enter')||was('Space')))advance();updateFx(dt);return}
  if(state==='confirm'){if(was('KeyJ')||was('Enter'))abortMission();else if(was('KeyN')||was('Escape'))state='play';return}
  if(was('Escape')&&state==='play'){askAbort();return}
  if(was('KeyP'))state=state==='pause'?'play':'pause';
  if(state==='pause')return;
  if(was('KeyM'))showMap=!showMap;
  time+=dt;if(msgT>0)msgT-=dt;if(shake>0)shake-=dt;if(flash>0)flash-=dt;

  // Spieler
  if(tp.jid!==null){const ddx=tp.jx-PAD.x,ddy=tp.jy-PAD.y,dl=Math.hypot(ddx,ddy);if(dl<5){tp.dx=tp.dy=0}else{const f=Math.min(1,(dl-5)/(PAD.r-14));tp.dx=ddx/dl*f;tp.dy=ddy/dl*f}}
  let mx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+tp.dx;
  let my=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+tp.dy;
  let l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l;l=1}
  P.sneak=!!(keys.KeyC||keys.ControlLeft||keys.ControlRight);
  if(P.st<=0)P.exh=true;if(P.st>25)P.exh=false;
  P.run=!!(keys.ShiftLeft||keys.ShiftRight||tp.run)&&l>0.2&&!P.exh&&!P.sneak;
  const sp=P.run?82:(P.sneak?(skill===1?36:26):48);
  P.moving=l>0.15;
  if(P.moving){P.a=Math.atan2(my,mx);moveEnt(P,mx*sp*dt,my*sp*dt,3);P.step+=sp*dt}
  P.st=Math.max(0,Math.min(100,P.st+(P.run?(skill===3?-22:-32):(P.moving?(skill===3?20:12):(skill===3?36:24)))*dt));
  P.cd-=dt;
  if((keys.Space||tp.fire)&&P.cd<=0){
    if(P.ammo>0){
      const a=skill===0?aimAssist(P.a):P.a+rnd(-.03,.03);
      bullets.push({x:P.x+Math.cos(a)*6,y:P.y+Math.sin(a)*6,vx:Math.cos(a)*280,vy:Math.sin(a)*280,life:skill===0?1.05:.8,own:true});
      P.ammo--;P.cd=skill===0?.09:.13;P.fl=time+.06;noise(P.x,P.y,skill===1?85:170);shotHeat+=skill===1?.5:1;if(shotHeat>=8){shotHeat=0;callRf(2)}tone(900,.06,'square',.04,-600);
    }else{P.cd=.3;tone(120,.05,'square',.03);if(!msgT||msg!=='KEINE MUNITION!')showMsg('KEINE MUNITION!',1)}
  }
  const gN=was('KeyG')||tp.nade;tp.nade=false;
  if(gN&&P.nades>0){
    P.nades--;nades.push({x:P.x,y:P.y,vx:Math.cos(P.a)*120,vy:Math.sin(P.a)*120,t:1.4});tone(300,.08,'square',.04,100);
  }
  const uU=was('KeyE')||tp.use;tp.use=false;if(uU)interact();

  // Ladungen
  for(const b of blds)if(b.kind==='depot'&&b.fuse>0){b.fuse-=dt;if(b.fuse<=0){b.fuse=0;destroyDepot(b)}}
  // Handgranaten
  for(const n of nades){
    n.t-=dt;
    const f=Math.max(0,1-1.6*dt);n.vx*=f;n.vy*=f;
    if(!hitSolid(n.x+n.vx*dt,n.y,2))n.x+=n.vx*dt;else n.vx=0;
    if(!hitSolid(n.x,n.y+n.vy*dt,2))n.y+=n.vy*dt;else n.vy=0;
    if(n.t<=0){n.dead=true;explode(n.x,n.y,skill===2?44:32)}
  }
  nades=nades.filter(n=>!n.dead);
  // Projektile
  for(const b of bullets){
    b.life-=dt;
    for(let s=0;s<2&&b.life>0;s++){
      b.x+=b.vx*dt/2;b.y+=b.vy*dt/2;
      const t=tileAt(Math.floor(b.x/T),Math.floor(b.y/T));
      if(t===1||t===2||t===5){b.life=0;parts.push({x:b.x,y:b.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.15,c:C.y});break}
      if(b.own){for(const e of enemies)if(!e.dead&&Math.abs(e.x-b.x)<5&&Math.abs(e.y-b.y)<5){killEnemy(e);b.life=0;break}}
      else if(Math.abs(P.x-b.x)<4&&Math.abs(P.y-b.y)<4){hurt(9);b.life=0}
    }
  }
  bullets=bullets.filter(b=>b.life>0);
  // Gegner
  for(const e of enemies){
    if(e.dead){e.t+=dt;continue}
    const d=dist(e.x,e.y,P.x,P.y);let sees=false;
    if(P.hp>0){
      const rg=(P.run?150:(P.sneak?55:105))*(skill===1?.62:1);
      if(d<rg){const diff=Math.abs(angDiff(Math.atan2(P.y-e.y,P.x-e.x),e.a));if((diff<1.1||d<26)&&los(e.x,e.y,P.x,P.y))sees=true}
    }
    if(sees){if(e.st===0)onSpot(e);e.st=1;e.gone=0;e.ret=false;e.lost=6;e.lx=P.x;e.ly=P.y}
    else if(e.st===1){e.lost-=dt;if(e.lost<=0){e.st=0;if(!e.rf)makePatrol(e);e.wait=1}}
    if(e.rf&&e.st===0){
      if(!e.ret){e.ret=true;const ra=Math.atan2(e.y-P.y,e.x-P.x);e.tx=e.x+Math.cos(ra)*260;e.ty=e.y+Math.sin(ra)*260;e.wait=0}
      if(Math.abs(e.x-P.x)>W/2+30||Math.abs(e.y-P.y)>H/2+30){e.gone=(e.gone||0)+dt;if(e.gone>1.5)e.del=true}
    }
    e.cd-=dt;
    if(e.st===1){
      if(sees&&d<140){
        e.a=Math.atan2(P.y-e.y,P.x-e.x);
        if(e.cd<=0){shootEnemy(e);e.cd=rnd(.7,1.3)}
        if(d>70)moveEnt(e,Math.cos(e.a)*52*dt,Math.sin(e.a)*52*dt,3);
      }else{
        const dd=dist(e.x,e.y,e.lx,e.ly);
        if(dd>6){e.a=Math.atan2(e.ly-e.y,e.lx-e.x);if(!moveEnt(e,Math.cos(e.a)*52*dt,Math.sin(e.a)*52*dt,3)){e.a+=rnd(-1.5,1.5)}}
      }
    }else if(e.wp){
      const L=e.wp.length;
      if(e.wait>0){e.wait-=dt;e.a=e.la+Math.sin(time*1.3+e.ph)*.6}
      else{
        const w=e.wp[e.wi],dd=dist(e.x,e.y,w.x,w.y);
        const nxt=()=>{if(L>1){e.wi+=e.wd;if(e.wi>=L||e.wi<0){e.wd=-e.wd;e.wi+=2*e.wd}}};
        if(dd<4){nxt();e.wait=rnd(.8,2.2);e.la=Math.atan2(e.wp[e.wi].y-e.y,e.wp[e.wi].x-e.x);e.stuck=0}
        else{
          e.a=Math.atan2(w.y-e.y,w.x-e.x);
          if(moveEnt(e,Math.cos(e.a)*30*dt,Math.sin(e.a)*30*dt,3))e.stuck=0;
          else{e.stuck+=dt;if(e.stuck>1){e.stuck=0;nxt()}}
        }
      }
    }else{
      if(e.wait>0){e.wait-=dt;if(R()<dt*.8)e.a+=rnd(-1,1)}
      else{
        const dd=dist(e.x,e.y,e.tx,e.ty);
        if(dd<4){e.wait=rnd(1,3);e.tx=e.x+rnd(-110,110);e.ty=e.y+rnd(-110,110)}
        else{e.a=Math.atan2(e.ty-e.y,e.tx-e.x);if(!moveEnt(e,Math.cos(e.a)*28*dt,Math.sin(e.a)*28*dt,3)){e.wait=rnd(.5,1.5);e.tx=e.x+rnd(-110,110);e.ty=e.y+rnd(-110,110)}}
      }
    }
  }
  enemies=enemies.filter(e=>!e.del);
  // Pickups
  for(const p of picks){
    if(!p.gone&&Math.abs(P.x-p.x)<8&&Math.abs(P.y-p.y)<8){
      if(p.t==='a'&&P.ammo<P.maxA){P.ammo=Math.min(P.maxA,P.ammo+24);p.gone=true}
      else if(p.t==='g'&&P.nades<P.maxG){P.nades=Math.min(P.maxG,P.nades+(skill===2?3:2));p.gone=true}
      else if(p.t==='m'&&P.hp<P.maxHp){P.hp=Math.min(P.maxHp,P.hp+(skill===3?45:30));p.gone=true}
      if(p.gone)tone(800,.08,'square',.04,200);
    }
  }
  picks=picks.filter(p=>!p.gone);
  updateFx(dt);
  cam.x=Math.max(0,Math.min(MW*T-W,P.x-W/2));cam.y=Math.max(0,Math.min(MH*T-H,P.y-H/2));
  if(ready&&state==='play'&&dist(P.x,P.y,LZ.x,LZ.y)<28)winGame();
}

function setupZones(mi){
  ZN=new Uint8Array(MW*MH);
  const hv=(x,y)=>(hash(x+mi*31,y+7)%1000)/1000,sm=t=>t*t*(3-2*t);
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),fx=sm(x-xi),fy=sm(y-yi);const a=hv(xi,yi),b2=hv(xi+1,yi),c2=hv(xi,yi+1),d2=hv(xi+1,yi+1);return a+(b2-a)*fx+(c2-a)*fy+(a-b2-c2+d2)*fx*fy};
  for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const n=vn(x/5,y/5)*.7+vn(x/2.3,y/2.3)*.3;ZN[y*MW+x]=n<.38?1:(n>.66?2:0)}
}
function drawTile(tx,ty,wf){
  const t=map[ty*MW+tx],x=tx*T,y=ty*T,h=hash(tx,ty);
  if(t===0||t===1||t===2){

    if(t===2)ctx.drawImage(SP.rock[h%3],x,y);
    else{const z=ZN[ty*MW+tx];if(z===1)rect(ctx,'rgba(0,30,10,.09)',x,y,T,T);else if(z===2)rect(ctx,'rgba(255,255,170,.05)',x,y,T,T)}
  }else if(t===3){
    ctx.drawImage(SP.water[h&3][wf],x,y);

    if(tileAt(tx,ty+1)!==3){rect(ctx,'rgba(210,235,255,.85)',x,y+T-1,T,1)}
    if(tileAt(tx-1,ty)!==3){rect(ctx,'rgba(210,235,255,.85)',x,y,1,T)}
    if(tileAt(tx+1,ty)!==3){rect(ctx,'rgba(210,235,255,.85)',x+T-1,y,1,T)}
  }else if(t===4)ctx.drawImage(SP.sand[h&3],x,y);
  else if(t===5)ctx.drawImage(SP.conc,x,y);
  else if(t===6)ctx.drawImage(SP.rubble[h&3],x,y);
  else if(t===7){
    ctx.drawImage(SP.dirt[h&3],x,y);

  }
}

    txt('GEFALLEN',W/2,80,'#ff5a4a','center',16);
    txt('DER RANGER IST NICHT ZURUECKGEKEHRT',W/2,100,'#fff','center');
    txt('FEINDE AUSGESCHALTET: '+kills,W/2,116,'#c8d8ff','center');
    if(endT>0.6)txt(touchMode?'ANTIPPEN = LEVEL NEU STARTEN':'ENTER = LEVEL NEU STARTEN',W/2,172,'#9fb0e0','center');
  }
}
function draw(){
  if(dirty){dirty=false;VIG=makeVig();MB=null;layoutBtn()}
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  if(state==='menu'){drawMenu();rotateHint();return}
  if(state==='skill'){drawSkill();rotateHint();return}
  const c=drawWorld();
  ctx.drawImage(VIG,0,0);
  drawHUD(c.cx,c.cy);
  if(state==='win'||state==='lose')drawEnd();
  if(state==='confirm')drawConfirm();
  if(state==='pause'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('PAUSE',W/2,H/2,'#fff','center',16)}
  rotateHint();
}
function rotateHint(){if(innerHeight>innerWidth*1.05){ctx.fillStyle='rgba(0,0,0,.78)';ctx.fillRect(0,H/2-24,W,48);txt('BITTE HANDY DREHEN',W/2,H/2-2,'#ffe070','center',8);txt('QUERFORMAT SPIELEN',W/2,H/2+12,'#fff','center',8)}}
buildSprites();

/* ---------- Hauptschleife ---------- */
function frame(ts){
  const dt=Math.min(0.05,(ts-lastTime)/1000||0.016);lastTime=ts;
  update(dt);
  for(const k in hit)hit[k]=false;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
